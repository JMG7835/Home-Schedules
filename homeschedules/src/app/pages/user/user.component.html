<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{user().name}}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    {{user().email}}
    {{user().phone}}
    {{user().address}}
    {{user().city}}
    {{user().zip}}
  </mat-card-content>
</mat-card>
